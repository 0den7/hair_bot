<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Календарь записи</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>Календарь записи</h1>
  <button onclick="openServices()">Услуги</button>
  <div id="calendar"></div>

  <div id="servicesModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:1px solid gray; z-index:1000;">
    <h3>Услуги</h3>
    <div id="servicesList"></div>
    <h4>Добавить услугу</h4>
    <input type="text" id="newName" placeholder="Название">
    <input type="number" id="newDuration" placeholder="Минуты">
    <input type="number" id="newPrice" placeholder="Цена">
    <button onclick="addService()">Добавить</button>
    <br><br>
    <button onclick="closeServices()">Закрыть</button>
  </div>

  <script>
    var calendar;
    function createAppointment(info) {
      var clientName = prompt('Имя клиента:');
      if (!clientName) {
        calendar.unselect();
        return;
      }
      var serviceId = prompt(
        'Выберите услугу:\n' +
        '1 - Стрижка\n' +
        '2 - Окрашивание\n' +
        '3 - Стрижка + Окрашивание'
      );
      if (!serviceId) {
        calendar.unselect();
        return;
      }
      var day = info.start.getFullYear() + '-' +
        String(info.start.getMonth() + 1).padStart(2, '0') + '-' +
        String(info.start.getDate()).padStart(2, '0');
      var startTime = String(info.start.getHours()).padStart(2, '0') + ':' +
        String(info.start.getMinutes()).padStart(2, '0');
      fetch('/api/appointments/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          client_name: clientName,
          service_id: parseInt(serviceId),
          day: day,
          start_time: startTime,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          calendar.refetchEvents();
          calendar.unselect();
        } else {
          alert(data.message);
          calendar.unselect();
        }
      });
    }
    function createBlock(info) {
      var reason = prompt('Причина блокировки (необязательно):');
      if (reason === null) {
        calendar.unselect();
        return;
      }
      var day = info.start.getFullYear() + '-' +
        String(info.start.getMonth() + 1).padStart(2, '0') + '-' +
        String(info.start.getDate()).padStart(2, '0');
      var startTime = String(info.start.getHours()).padStart(2, '0') + ':' +
        String(info.start.getMinutes()).padStart(2, '0');
      var endTime = String(info.end.getHours()).padStart(2, '0') + ':' +
        String(info.end.getMinutes()).padStart(2, '0');
      fetch('/api/appointments/blocked', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          day: day,
          start_time: startTime,
          end_time: endTime,
          reason: reason,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          calendar.refetchEvents();
          calendar.unselect();
        } else {
          alert(data.message);
          calendar.unselect();
        }
      });
    }

    function openServices() {
      document.getElementById('servicesModal').style.display = 'block';
      loadServices();
    }

    function closeServices() {
      document.getElementById('servicesModal').style.display = 'none';
    }

    function loadServices() {
      fetch('/api/services/')
        .then(function (response) {
          return response.json();
        })
        .then(function (services) {
          var html = '<ul>';
          services.forEach(function (service) {
            html += '<li>' + service.name + ' — ' + service.duration +
              ' мин, ' + service.price + '₽ (' +
              (service.is_active ? 'активна' : 'скрыта') + ') ' +
              '<button onclick="toggleService(' + service.id + ')">Переключить</button> ' +
              '<button onclick="deleteService(' + service.id + ')">Удалить</button></li>';
          });
          html += '</ul>';
          document.getElementById('servicesList').innerHTML = html;
        });
    }

    function addService() {
      var name = document.getElementById('newName').value;
      var duration = parseInt(document.getElementById('newDuration').value);
      var price = parseInt(document.getElementById('newPrice').value);

      fetch('/api/services/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name: name,
          duration: duration,
          price: price,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadServices();
          document.getElementById('newName').value = '';
          document.getElementById('newDuration').value = '';
          document.getElementById('newPrice').value = '';
        } else {
          alert(data.message);
        }
      });
    }

    function toggleService(id) {
      fetch('/api/services/' + id + '/toggle', {
        method: 'POST',
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadServices();
          calendar.refetchEvents();
        } else {
          alert(data.message);
        }
      });
    }

    function deleteService(id) {
      if (!confirm('Удалить услугу?')) return;

      fetch('/api/services/' + id, {
        method: 'DELETE',
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadServices();
          calendar.refetchEvents();
        } else {
          alert(data.message);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        locale: 'ru',
        firstDay: 1,
        slotMinTime: '10:00:00',
        slotMaxTime: '20:00:00',
        slotDuration: '00:30:00',
        allDaySlot: false,
        weekends: false,
        height: 'auto',
        eventSources: [
          { url: '/api/appointments/' },
          { url: '/api/appointments/blocked' },
        ],
        editable: true,
        slotConstraint: {
          startTime: '10:00:00',
          endTime: '20:00:00',
        },
        eventConstraint: {
          startTime: '10:00:00',
          endTime: '20:00:00',
        },
        eventDrop: function (info) {
          var appointment = info.event;
          if (appointment.id.toString().startsWith('blocked_')) {
            info.revert();
            return;
          }
          var newDate = appointment.start.getFullYear() + '-' +
            String(appointment.start.getMonth() + 1).padStart(2, '0') + '-' +
            String(appointment.start.getDate()).padStart(2, '0');
          var newTime = String(appointment.start.getHours()).padStart(2, '0') + ':' +
            String(appointment.start.getMinutes()).padStart(2, '0');
          fetch('/api/appointments/' + appointment.id + '/move', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              new_date: newDate,
              new_time: newTime,
            }),
          }).then(function (response) {
            return response.json();
          }).then(function (data) {
            if (!data.success) {
              alert(data.message);
              info.revert();
            }
          });
        },
        eventClick: function (info) {
          if (info.event.id.toString().startsWith('blocked_')) {
            if (!confirm('Удалить блокировку?')) return;
            var blockedId = info.event.id.replace('blocked_', '');
            fetch('/api/appointments/blocked/' + blockedId, {
              method: 'DELETE',
            }).then(function (response) {
              return response.json();
            }).then(function (data) {
              if (data.success) {
                info.event.remove();
              } else {
                alert(data.message);
              }
            });
            return;
          }
          if (!confirm('Отменить запись?')) return;
          fetch('/api/appointments/' + info.event.id, {
            method: 'DELETE',
          }).then(function (response) {
            return response.json();
          }).then(function (data) {
            if (data.success) {
              info.event.remove();
            } else {
              alert(data.message);
            }
          });
        },
        selectable: true,
        selectConstraint: {
          startTime: '10:00:00',
          endTime: '20:00:00',
        },
        select: function (info) {
          var action = prompt('Что создать?\n1 - Запись\n2 - Блокировка');
          if (action === null) {
            calendar.unselect();
            return;
          }
          if (action === '1') {
            createAppointment(info);
            return;
          }
          if (action === '2') {
            createBlock(info);
            return;
          }
          calendar.unselect();
          alert('Введите 1 или 2');
        },
      });
      calendar.render();
    });
  </script>
</body>
</html>
