<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Календарь записи</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>Календарь записи</h1>
  <div id="calendar"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        locale: 'ru',
        firstDay: 1,
        slotMinTime: '10:00:00',
        slotMaxTime: '20:00:00',
        slotDuration: '00:30:00',
        allDaySlot: false,
        weekends: false,
        height: 'auto',
        eventSources: [
          { url: '/api/appointments/' },
          { url: '/api/appointments/blocked' },
        ],
        editable: true,
        slotConstraint: {
          startTime: '10:00:00',
          endTime: '20:00:00',
        },
        eventConstraint: {
          startTime: '10:00:00',
          endTime: '20:00:00',
        },
        eventDrop: function (info) {
          var appointment = info.event;
          if (appointment.id.toString().startsWith('blocked_')) {
            info.revert();
            return;
          }
          var newDate = appointment.start.getFullYear() + '-' +
            String(appointment.start.getMonth() + 1).padStart(2, '0') + '-' +
            String(appointment.start.getDate()).padStart(2, '0');
          var newTime = String(appointment.start.getHours()).padStart(2, '0') + ':' +
            String(appointment.start.getMinutes()).padStart(2, '0');
          fetch('/api/appointments/' + appointment.id + '/move', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              new_date: newDate,
              new_time: newTime,
            }),
          }).then(function (response) {
            return response.json();
          }).then(function (data) {
            if (!data.success) {
              alert(data.message);
              info.revert();
            }
          });
        },
        eventClick: function (info) {
          if (info.event.id.toString().startsWith('blocked_')) {
            if (!confirm('Удалить блокировку?')) return;
            var blockedId = info.event.id.replace('blocked_', '');
            fetch('/api/appointments/blocked/' + blockedId, {
              method: 'DELETE',
            }).then(function (response) {
              return response.json();
            }).then(function (data) {
              if (data.success) {
                info.event.remove();
              } else {
                alert(data.message);
              }
            });
            return;
          }
          if (!confirm('Отменить запись?')) return;
          fetch('/api/appointments/' + info.event.id, {
            method: 'DELETE',
          }).then(function (response) {
            return response.json();
          }).then(function (data) {
            if (data.success) {
              info.event.remove();
            } else {
              alert(data.message);
            }
          });
        },
        selectable: true,
        selectConstraint: {
          startTime: '10:00:00',
          endTime: '20:00:00',
        },
        select: function (info) {
          var reason = prompt('Причина блокировки (необязательно):');
          if (reason === null) {
            calendar.unselect();
            return;
          }
          var day = info.start.getFullYear() + '-' +
            String(info.start.getMonth() + 1).padStart(2, '0') + '-' +
            String(info.start.getDate()).padStart(2, '0');
          var startTime = String(info.start.getHours()).padStart(2, '0') + ':' +
            String(info.start.getMinutes()).padStart(2, '0');
          var endTime = String(info.end.getHours()).padStart(2, '0') + ':' +
            String(info.end.getMinutes()).padStart(2, '0');
          fetch('/api/appointments/blocked', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              day: day,
              start_time: startTime,
              end_time: endTime,
              reason: reason,
            }),
          }).then(function (response) {
            return response.json();
          }).then(function (data) {
            if (data.success) {
              calendar.addEvent({
                id: 'blocked_' + data.id,
                title: 'Занято',
                start: info.startStr,
                end: info.endStr,
                color: 'gray',
              });
            } else {
              alert(data.message);
              calendar.unselect();
            }
          });
        },
      });
      calendar.render();
    });
  </script>
</body>
</html>
