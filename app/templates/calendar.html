<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Календарь записи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #calendar {
      max-width: 900px;
      margin: 0 auto;
    }
    body > button:last-child {
      background: #f0f0f0;
      border: 1px solid #ccc;
    }
    @media (max-width: 768px) {
      body {
        margin: 5px;
      }
      #calendar {
        max-width: 100%;
      }
      body > button {
        font-size: 16px !important;
        padding: 12px !important;
        display: block !important;
        width: 100% !important;
        margin-bottom: 8px !important;
      }
      #servicesModal,
      #editModal,
      #workingHoursModal {
        width: 95%;
        max-height: 90vh;
        overflow-y: auto;
        box-sizing: border-box;
      }
      input {
        font-size: 16px;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 20px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <h1>Календарь записи</h1>
  <button onclick="openServices()">Услуги</button>
  <button onclick="openWorkingHours()">Рабочее время</button>
  <button onclick="exportCsv()">Скачать таблицу записей</button>
  <button onclick="location.href='/logout'">Выйти</button>
  <div id="calendar"></div>

  <div id="servicesModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:1px solid gray; z-index:1000;">
    <h3>Услуги</h3>
    <div id="servicesList"></div>
    <h4>Добавить услугу</h4>
    <input type="text" id="newName" placeholder="Название">
    <input type="number" id="newDuration" placeholder="Минуты">
    <input type="number" id="newPrice" placeholder="Цена">
    <button onclick="addService()">Добавить</button>
    <br><br>
    <button onclick="closeServices()">Закрыть</button>
  </div>

  <div id="editModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:1px solid gray; z-index:1001;">
    <h3>Изменить услугу</h3>
    <input type="hidden" id="editId">
    <p>Название</p>
    <input type="text" id="editName">
    <p>Длительность (минут)</p>
    <input type="number" id="editDuration">
    <p>Цена (₽)</p>
    <input type="number" id="editPrice">
    <br><br>
    <button onclick="saveEdit()">Сохранить</button>
    <button onclick="closeEdit()">Отмена</button>
  </div>

  <div id="workingHoursModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:1px solid gray; z-index:1002;">
    <h3>Рабочее время</h3>
    <div id="workingHoursList"></div>
    <br>
    <button onclick="closeWorkingHours()">Закрыть</button>
  </div>

  <script>
    var calendar;
    function createAppointment(info) {
      var clientName = prompt('Имя клиента:');
      if (!clientName) {
        calendar.unselect();
        return;
      }
      var serviceId = prompt(
        'Выберите услугу:\n' +
        '1 - Стрижка\n' +
        '2 - Окрашивание\n' +
        '3 - Стрижка + Окрашивание'
      );
      if (!serviceId) {
        calendar.unselect();
        return;
      }
      var day = info.start.getFullYear() + '-' +
        String(info.start.getMonth() + 1).padStart(2, '0') + '-' +
        String(info.start.getDate()).padStart(2, '0');
      var startTime = String(info.start.getHours()).padStart(2, '0') + ':' +
        String(info.start.getMinutes()).padStart(2, '0');
      fetch('/api/appointments/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          client_name: clientName,
          service_id: parseInt(serviceId),
          day: day,
          start_time: startTime,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          alert('Запись создана с ' + data.start_time + ' до ' + data.end_time);
          calendar.refetchEvents();
          calendar.unselect();
        } else {
          alert(data.message);
          calendar.unselect();
        }
      });
    }
    function createBlock(info) {
      var reason = prompt('Причина блокировки (необязательно):');
      if (reason === null) {
        calendar.unselect();
        return;
      }
      var day = info.start.getFullYear() + '-' +
        String(info.start.getMonth() + 1).padStart(2, '0') + '-' +
        String(info.start.getDate()).padStart(2, '0');
      var startTime = String(info.start.getHours()).padStart(2, '0') + ':' +
        String(info.start.getMinutes()).padStart(2, '0');
      var endTime = String(info.end.getHours()).padStart(2, '0') + ':' +
        String(info.end.getMinutes()).padStart(2, '0');
      fetch('/api/appointments/blocked', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          day: day,
          start_time: startTime,
          end_time: endTime,
          reason: reason,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          calendar.refetchEvents();
          calendar.unselect();
        } else {
          alert(data.message);
          calendar.unselect();
        }
      });
    }

    function openServices() {
      document.getElementById('servicesModal').style.display = 'block';
      loadServices();
    }

    function closeServices() {
      document.getElementById('servicesModal').style.display = 'none';
    }

    function loadServices() {
      fetch('/api/services/')
        .then(function (response) {
          return response.json();
        })
        .then(function (services) {
          var html = '<ul>';
          services.forEach(function (service) {
            html += '<li>' + service.name + ' — ' + service.duration +
              ' мин, ' + service.price + '₽ (' +
              (service.is_active ? 'активна' : 'скрыта') + ') ' +
              '<button onclick="toggleService(' + service.id + ')">Переключить статус услуги</button> ' +
              '<button onclick="openEdit(' + service.id + ', \'' + service.name + '\', ' + service.duration + ', ' + service.price + ')">Изменить</button> ' +
              '<button onclick="deleteService(' + service.id + ')">Удалить</button></li>';
          });
          html += '</ul>';
          document.getElementById('servicesList').innerHTML = html;
        });
    }

    function addService() {
      var name = document.getElementById('newName').value;
      var duration = parseInt(document.getElementById('newDuration').value);
      var price = parseInt(document.getElementById('newPrice').value);
      fetch('/api/services/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name: name,
          duration: duration,
          price: price,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadServices();
          document.getElementById('newName').value = '';
          document.getElementById('newDuration').value = '';
          document.getElementById('newPrice').value = '';
        } else {
          alert(data.message);
        }
      });
    }

    function toggleService(id) {
      fetch('/api/services/' + id + '/toggle', {
        method: 'POST',
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadServices();
          calendar.refetchEvents();
        } else {
          alert(data.message);
        }
      });
    }

    function deleteService(id) {
      if (!confirm('Удалить услугу?')) return;

      fetch('/api/services/' + id, {
        method: 'DELETE',
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadServices();
          calendar.refetchEvents();
        } else {
          alert(data.message);
        }
      });
    }

    function openEdit(id, name, duration, price) {
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = name;
      document.getElementById('editDuration').value = duration;
      document.getElementById('editPrice').value = price;
      document.getElementById('editModal').style.display = 'block';
    }

    function saveEdit() {
      var id = document.getElementById('editId').value;
      var name = document.getElementById('editName').value;
      var duration = parseInt(document.getElementById('editDuration').value);
      var price = parseInt(document.getElementById('editPrice').value);
      fetch('/api/services/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name: name,
          duration: duration,
          price: price,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          closeEdit();
          loadServices();
          calendar.refetchEvents();
        } else {
          alert(data.message);
        }
      });
    }

    function closeEdit() {
      document.getElementById('editModal').style.display = 'none';
    }

    function openWorkingHours() {
      document.getElementById('workingHoursModal').style.display = 'block';
      loadWorkingHours();
    }

    function closeWorkingHours() {
      document.getElementById('workingHoursModal').style.display = 'none';
    }

    function loadWorkingHours() {
      fetch('/api/working-hours/')
        .then(function (response) {
          return response.json();
        })
        .then(function (days) {
          var html = '<ul>';
          days.forEach(function (day) {
            html += '<li>' + day.label + ': ' +
              day.start_time + ' - ' + day.end_time + ' (' +
              (day.is_working ? 'рабочий' : 'выходной') + ') ' +
              '<button onclick="editWorkingHours(' + day.day_of_week + ', \'' + day.start_time + '\', \'' + day.end_time + '\', ' + day.is_working + ')">Изменить</button></li>';
          });
          html += '</ul>';
          document.getElementById('workingHoursList').innerHTML = html;
        });
    }

    function editWorkingHours(dayOfWeek, currentStart, currentEnd, currentIsWorking) {
      var newStart = prompt('Начало (ЧЧ:ММ):', currentStart);
      if (newStart === null) return;
      var newEnd = prompt('Конец (ЧЧ:ММ):', currentEnd);
      if (newEnd === null) return;
      var isWorking = confirm('Сделать день рабочим? Нажмите Ок — рабочий, Отменить — выходной.');
      fetch('/api/working-hours/' + dayOfWeek, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          start_time: newStart,
          end_time: newEnd,
          is_working: isWorking,
        }),
      }).then(function (response) {
        return response.json();
      }).then(function (data) {
        if (data.success) {
          loadWorkingHours();
          location.reload();
        } else {
          alert(data.message);
        }
      });
    }

    function fetchWorkingHoursBounds() {
      return fetch('/api/working-hours/')
        .then(function (response) {
          return response.json();
        })
        .then(function (days) {
          var workingDays = days.filter(function (day) {
            return day.is_working;
          });
          if (workingDays.length === 0) {
            return { minTime: '10:00:00', maxTime: '20:00:00' };
          }
          var minTime = workingDays[0].start_time;
          var maxTime = workingDays[0].end_time;
          workingDays.forEach(function (day) {
            if (day.start_time < minTime) minTime = day.start_time;
            if (day.end_time > maxTime) maxTime = day.end_time;
          });
          return {
            minTime: minTime + ':00',
            maxTime: maxTime + ':00',
          };
        });
    }

    function exportCsv() {
      var start = calendar.view.activeStart.toISOString().slice(0, 10);
      var end = calendar.view.activeEnd.toISOString().slice(0, 10);
      window.location.href = '/api/appointments/export?start=' + start + '&end=' + end;
    }

    document.addEventListener('DOMContentLoaded', function () {
      fetchWorkingHoursBounds().then(function (bounds) {
        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
          initialView: 'timeGridWeek',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
          },
          locale: 'ru',
          firstDay: 1,
          slotMinTime: bounds.minTime,
          slotMaxTime: bounds.maxTime,
          slotDuration: '00:30:00',
          allDaySlot: false,
          weekends: false,
          height: 'auto',
          eventSources: [
            { url: '/api/appointments/' },
            { url: '/api/appointments/blocked' },
          ],
          editable: true,
          slotConstraint: {
            startTime: bounds.minTime,
            endTime: bounds.maxTime,
          },
          eventConstraint: {
            startTime: bounds.minTime,
            endTime: bounds.maxTime,
          },
          eventDrop: function (info) {
            var appointment = info.event;
            if (appointment.id.toString().startsWith('blocked_')) {
              info.revert();
              return;
            }
            var newDate = appointment.start.getFullYear() + '-' +
              String(appointment.start.getMonth() + 1).padStart(2, '0') + '-' +
              String(appointment.start.getDate()).padStart(2, '0');
            var newTime = String(appointment.start.getHours()).padStart(2, '0') + ':' +
              String(appointment.start.getMinutes()).padStart(2, '0');
            fetch('/api/appointments/' + appointment.id + '/move', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                new_date: newDate,
                new_time: newTime,
              }),
            }).then(function (response) {
              return response.json();
            }).then(function (data) {
              if (!data.success) {
                alert(data.message);
                info.revert();
              }
            });
          },
          eventClick: function (info) {
            if (info.event.id.toString().startsWith('blocked_')) {
              if (!confirm('Удалить блокировку?')) return;
              var blockedId = info.event.id.replace('blocked_', '');
              fetch('/api/appointments/blocked/' + blockedId, {
                method: 'DELETE',
              }).then(function (response) {
                return response.json();
              }).then(function (data) {
                if (data.success) {
                  info.event.remove();
                } else {
                  alert(data.message);
                }
              });
              return;
            }
            if (!confirm('Отменить запись?')) return;
            fetch('/api/appointments/' + info.event.id, {
              method: 'DELETE',
            }).then(function (response) {
              return response.json();
            }).then(function (data) {
              if (data.success) {
                info.event.remove();
              } else {
                alert(data.message);
              }
            });
          },
          selectable: true,
          selectConstraint: {
            startTime: bounds.minTime,
            endTime: bounds.maxTime,
          },
          select: function (info) {
            var action = prompt('Что создать?\n1 - Запись\n2 - Блокировка');
            if (action === null) {
              calendar.unselect();
              return;
            }
            if (action === '1') {
              createAppointment(info);
              return;
            }
            if (action === '2') {
              createBlock(info);
              return;
            }
            calendar.unselect();
            alert('Введите 1 или 2');
          },
        });
        calendar.render();
      });
    });
  </script>
</body>
</html>
